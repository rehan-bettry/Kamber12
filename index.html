<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - Edit Feature</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-left">
      <span class="nav-title">Profile</span>
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" placeholder="Search...">
      </div>
    </div>
    <div class="nav-right">
      <button class="icon-btn" title="Theme">🌓</button>
      <button class="icon-btn notification" title="Notifications">
        🔔 <span class="badge">3</span>
      </button>
      <button class="icon-btn" title="Messages">✉️</button>
      <div class="user-chip">
        <div class="avatar-sm" id="navAvatar">RA</div>
        <div class="user-info">
          <span class="name" id="navName">Rehan Ali</span>
          <span class="role" id="navRole">Admin</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">My Profile</h1>

    <!-- Profile Card -->
    <div class="profile-card">
      <!-- Header with gradient -->
      <div class="profile-header">
        <div class="avatar-lg" id="profileAvatar">RA</div>
        <div class="header-info">
          <h2 id="displayName">Rehan Ali</h2>
          <p id="displayRole">Admin</p>
        </div>
        <button class="edit-btn" id="editBtn" onclick="openEditModal()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
          </svg>
          Edit Profile
        </button>
      </div>

      <!-- Details -->
      <div class="profile-details">
        <div class="detail-item">
          <span class="label">USER ID</span>
          <span class="value" id="displayUserId">USR001</span>
        </div>
        <div class="detail-item">
          <span class="label">EMAIL</span>
          <span class="value" id="displayEmail">admin@rehan-school.com</span>
        </div>
        <div class="detail-item">
          <span class="label">PHONE</span>
          <span class="value" id="displayPhone">03322131388</span>
        </div>
        <div class="detail-item">
          <span class="label">ROLE</span>
          <span class="value" id="displayRole2">Admin</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Profile</h3>
        <button class="close-btn" onclick="closeEditModal()">×</button>
      </div>
      <form id="editForm" onsubmit="saveProfile(event)">
        
        <!-- Profile Picture Upload -->
        <div class="photo-upload-section">
          <div class="photo-preview-wrap">
            <div class="photo-preview" id="photoPreview">RA</div>
            <label for="photoInput" class="photo-change-btn" title="Change Photo">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                <circle cx="12" cy="13" r="4"></circle>
              </svg>
            </label>
            <input type="file" id="photoInput" accept="image/*" hidden onchange="handlePhotoSelect(event)">
          </div>
          <div class="photo-actions">
            <button type="button" class="btn-photo" onclick="document.getElementById('photoInput').click()">
              Upload Photo
            </button>
            <button type="button" class="btn-photo-remove" id="removePhotoBtn" onclick="removePhoto()" style="display:none;">
              Remove
            </button>
          </div>
          <p class="photo-hint">JPG, PNG or GIF • Max 2MB</p>
        </div>

        <div class="form-group">
          <label for="inputName">Full Name</label>
          <input type="text" id="inputName" required minlength="2" maxlength="50">
        </div>
        <div class="form-group">
          <label for="inputEmail">Email</label>
          <input type="email" id="inputEmail" required>
        </div>
        <div class="form-group">
          <label for="inputPhone">Phone</label>
          <input type="tel" id="inputPhone" required pattern="[0-9]{10,15}" title="Enter 10-15 digits">
        </div>
        <div class="form-group">
          <label for="inputRole">Role</label>
          <select id="inputRole">
            <option value="Admin">Admin</option>
            <option value="Teacher">Teacher</option>
            <option value="Student">Student</option>
            <option value="Staff">Staff</option>
          </select>
        </div>
        <div class="form-group">
          <label for="inputUserId">User ID (read-only)</label>
          <input type="text" id="inputUserId" readonly>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" onclick="closeEditModal()">Cancel</button>
          <button type="submit" class="btn-save">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
